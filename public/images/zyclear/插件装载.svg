<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#546e7a"/>
    </marker>
    <marker id="aR" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#fafafa"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">装载一个面板：扫目录，认两个符号</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#666">宿主不认识插件的类，只认两个 C 函数 —— 认到了，就当它能用</text>

  <!-- 步骤 -->
  <rect x="40" y="88" width="920" height="330" rx="12" fill="#f7f7f7" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- 1 -->
  <text x="60" y="118" font-size="13.5" font-weight="bold" fill="#37474f">① 扫描目录</text>
  <rect x="60" y="132" width="230" height="76" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="175" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">可执行目录 / extensions/</text>
  <text x="175" y="178" text-anchor="middle" font-size="11" fill="#1565c0">只认 *.dll，不递归子目录</text>
  <text x="175" y="197" text-anchor="middle" font-size="10.5" fill="#64b5f6">启动时扫一遍</text>

  <line x1="290" y1="170" x2="322" y2="170" stroke="#546e7a" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- 2 -->
  <text x="326" y="118" font-size="13.5" font-weight="bold" fill="#37474f">② 试着解析两个符号</text>
  <rect x="326" y="132" width="280" height="76" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="466" y="156" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" font-weight="bold" fill="#e65100">ZyClearExtensionCount</text>
  <text x="466" y="176" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" font-weight="bold" fill="#e65100">ZyClearExtensionAt</text>
  <text x="466" y="197" text-anchor="middle" font-size="10.5" fill="#a1887f">两个都解析到 = 合法插件；缺一个就跳过</text>

  <line x1="606" y1="170" x2="638" y2="170" stroke="#546e7a" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- 3 -->
  <text x="642" y="118" font-size="13.5" font-weight="bold" fill="#37474f">③ 登记（不 new 对象）</text>
  <rect x="642" y="132" width="298" height="76" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="791" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">注册表里登记的是「转发闭包」</text>
  <text x="791" y="178" text-anchor="middle" font-size="11" fill="#2e7d32">此刻还不调用 At，对象也没造</text>
  <text x="791" y="197" text-anchor="middle" font-size="10.5" fill="#66bb6a">QLibrary 也不解载 —— 留着</text>

  <!-- 契约 -->
  <text x="60" y="248" font-size="14" font-weight="bold" fill="#37474f">这两个导出名和签名，是宿主与插件之间唯一的硬契约</text>

  <rect x="60" y="262" width="440" height="66" rx="7" fill="#ffffff" stroke="#f9a825" stroke-width="1.8"/>
  <text x="76" y="284" font-size="11.5" font-family="Consolas, monospace" fill="#e65100">extern "C" int ZyClearExtensionCount();</text>
  <text x="76" y="306" font-size="11.5" font-family="Consolas, monospace" fill="#e65100">extern "C" IPanel* ZyClearExtensionAt(int index);</text>
  <text x="76" y="322" font-size="10.5" fill="#a1887f">extern "C" 同时负责去掉 C++ 的名字修饰</text>

  <rect x="520" y="262" width="420" height="66" rx="7" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="536" y="284" font-size="11.5" font-weight="bold" fill="#b71c1c">改名或改签名，编译期不会报错</text>
  <text x="536" y="304" font-size="11" fill="#c62828">宿主照样能编过、插件照样能编过，</text>
  <text x="536" y="322" font-size="11" font-weight="bold" fill="#b71c1c">只在运行期静默错调 —— 老 DLL 被认成新接口</text>

  <rect x="60" y="342" width="880" height="60" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.8"/>
  <text x="80" y="366" font-size="12.5" font-weight="bold" fill="#0d47a1">按 C++ 链接的话，名字会被编码成带参数类型的长串 —— 插件换个编译器版本，宿主就 resolve 不到</text>
  <text x="80" y="388" font-size="11.5" fill="#1565c0">所以这里必须是纯 C 符号。这一条不是风格偏好，是 ABI 的硬要求。</text>

  <!-- 代价 -->
  <rect x="60" y="436" width="880" height="200" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="80" y="464" font-size="14" font-weight="bold" fill="#37474f">这套机制的代价面（不只是好处）</text>

  <rect x="80" y="478" width="270" height="72" rx="7" fill="#ffffff" stroke="#b0bec5" stroke-width="1.6"/>
  <text x="94" y="500" font-size="12" font-weight="bold" fill="#c62828">① 同编译器、同运行库</text>
  <text x="94" y="522" font-size="11" fill="#546e7a">插件与主程序必须一致，否则</text>
  <text x="94" y="540" font-size="11" fill="#546e7a">传递 QWidget* 会出问题</text>

  <rect x="366" y="478" width="270" height="72" rx="7" fill="#ffffff" stroke="#b0bec5" stroke-width="1.6"/>
  <text x="380" y="500" font-size="12" font-weight="bold" fill="#c62828">② IPanel 析构必须虚</text>
  <text x="380" y="522" font-size="11" fill="#546e7a">主程序只经 IPanel* 持有面板；</text>
  <text x="380" y="540" font-size="11" fill="#546e7a">非虚则只跑基类析构，资源全漏</text>

  <rect x="652" y="478" width="268" height="72" rx="7" fill="#ffffff" stroke="#b0bec5" stroke-width="1.6"/>
  <text x="666" y="500" font-size="12" font-weight="bold" fill="#c62828">③ 标题被三处共用</text>
  <text x="666" y="522" font-size="11" fill="#546e7a">dock 标题、视图菜单项、工具栏</text>
  <text x="666" y="540" font-size="11" fill="#546e7a">提示 —— 所以规定要写短</text>

  <rect x="80" y="562" width="840" height="58" rx="7" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.8"/>
  <text x="96" y="584" font-size="12.5" font-weight="bold" fill="#1b5e20">换来的是：新增面板不重编主程序</text>
  <text x="96" y="606" font-size="11.5" fill="#2e7d32">注册表按唯一 ID 去重、同名注册被拒；内置面板先登记占位，外部同 id 的会被挡掉。示例插件工程四个文件，就是一个可装载的面板。</text>
</svg>
