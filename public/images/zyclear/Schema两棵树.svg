<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#546e7a"/>
    </marker>
    <marker id="aR" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#fafafa"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">参数表从代码搬进配置：两棵树对上</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#666">JSON 描述一棵参数树，运行时把它渲染成另一棵控件树 —— 中间只经过一次解析</text>

  <!-- 左：JSON 树 -->
  <rect x="40" y="88" width="380" height="440" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="230" y="118" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#e65100">VirtualCameraParam.json</text>
  <text x="230" y="140" text-anchor="middle" font-size="11.5" fill="#a1887f">配置资产 —— 改它不用编译</text>

  <rect x="64" y="158" width="332" height="30" rx="6" fill="#ffffff" stroke="#f9a825" stroke-width="1.6"/>
  <text x="78" y="178" font-size="12" font-family="Consolas, monospace" fill="#8d6e63">[ 分组数组 ]</text>

  <rect x="80" y="198" width="300" height="62" rx="7" fill="#fffde7" stroke="#fdd835" stroke-width="1.8"/>
  <text x="94" y="220" font-size="12" font-weight="bold" fill="#795548">group: DeviceControl</text>
  <text x="94" y="242" font-size="11" font-family="Consolas, monospace" fill="#a1887f">params: [ 3 项 ]</text>

  <rect x="80" y="270" width="300" height="62" rx="7" fill="#fffde7" stroke="#fdd835" stroke-width="1.8"/>
  <text x="94" y="292" font-size="12" font-weight="bold" fill="#795548">group: ImageFormatControl</text>
  <text x="94" y="314" font-size="11" font-family="Consolas, monospace" fill="#a1887f">params: [ 9 项 ]</text>

  <rect x="80" y="342" width="300" height="62" rx="7" fill="#fffde7" stroke="#fdd835" stroke-width="1.8"/>
  <text x="94" y="364" font-size="12" font-weight="bold" fill="#795548">group: AcquisitionControl</text>
  <text x="94" y="386" font-size="11" font-family="Consolas, monospace" fill="#a1887f">params: [ 10 项 ]</text>

  <rect x="80" y="414" width="300" height="42" rx="7" fill="#fffde7" stroke="#fdd835" stroke-width="1.8"/>
  <text x="94" y="440" font-size="12" font-weight="bold" fill="#795548">AnalogControl（11）· UserSetControl（4）</text>

  <rect x="80" y="468" width="300" height="46" rx="7" fill="#ffffff" stroke="#f9a825" stroke-width="1.6"/>
  <text x="94" y="488" font-size="11" fill="#8d6e63">每项参数：</text>
  <text x="94" y="505" font-size="11" font-family="Consolas, monospace" fill="#795548">{ name, type, relative_list, tips }</text>

  <text x="230" y="546" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">5 组 · 37 项</text>

  <!-- 箭头 -->
  <line x1="420" y1="308" x2="468" y2="308" stroke="#546e7a" stroke-width="3" marker-end="url(#a)"/>
  <text x="444" y="298" text-anchor="middle" font-size="11" fill="#546e7a">解析</text>
  <text x="444" y="330" text-anchor="middle" font-size="10.5" fill="#90a4ae">ParseUiJson</text>

  <!-- 右：控件树 -->
  <rect x="472" y="88" width="488" height="440" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/>
  <text x="716" y="118" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0d47a1">界面上的控件树</text>
  <text x="716" y="140" text-anchor="middle" font-size="11.5" fill="#64b5f6">参数区本身是空壳，控件在这里现场挂上去</text>

  <rect x="496" y="158" width="440" height="30" rx="6" fill="#ffffff" stroke="#1976d2" stroke-width="1.6"/>
  <text x="510" y="178" font-size="12" font-family="Consolas, monospace" fill="#0d47a1">QTreeView + CameraParamModel</text>

  <rect x="512" y="198" width="408" height="66" rx="7" fill="#bbdefb" stroke="#1976d2" stroke-width="1.8"/>
  <text x="526" y="220" font-size="12" font-weight="bold" fill="#0d47a1">分组节点（可折叠）</text>
  <text x="526" y="242" font-size="11" fill="#1565c0">3 项 → 折叠起来就一行</text>
  <text x="880" y="232" text-anchor="end" font-size="18" fill="#64b5f6">▸</text>

  <rect x="512" y="274" width="408" height="66" rx="7" fill="#bbdefb" stroke="#1976d2" stroke-width="1.8"/>
  <text x="526" y="296" font-size="12" font-weight="bold" fill="#0d47a1">分组节点</text>
  <text x="526" y="318" font-size="11" fill="#1565c0">9 项</text>
  <text x="880" y="308" text-anchor="end" font-size="18" fill="#64b5f6">▸</text>

  <rect x="512" y="350" width="408" height="66" rx="7" fill="#bbdefb" stroke="#1976d2" stroke-width="1.8"/>
  <text x="526" y="372" font-size="12" font-weight="bold" fill="#0d47a1">分组节点…</text>
  <text x="526" y="394" font-size="11" fill="#1565c0">10 项</text>
  <text x="880" y="384" text-anchor="end" font-size="18" fill="#64b5f6">▸</text>

  <!-- 叶子：六类控件 -->
  <text x="512" y="444" font-size="11.5" fill="#1565c0">展开后每项参数长成一个控件，按 type 分派：</text>

  <rect x="512" y="456" width="132" height="50" rx="6" fill="#ffffff" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="578" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">IntCustom</text>
  <text x="578" y="494" text-anchor="middle" font-size="10.5" fill="#64b5f6">QSpinBox</text>

  <rect x="652" y="456" width="132" height="50" rx="6" fill="#ffffff" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="718" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">EnumCustom</text>
  <text x="718" y="494" text-anchor="middle" font-size="10.5" fill="#64b5f6">QComboBox</text>

  <rect x="792" y="456" width="132" height="50" rx="6" fill="#ffffff" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="858" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">其他四类</text>
  <text x="858" y="494" text-anchor="middle" font-size="10.5" fill="#64b5f6">Bool / String / Cmd / Double</text>

  <!-- 底部：那个失败的坑 -->
  <rect x="60" y="556" width="880" height="88" rx="10" fill="#ffebee" stroke="#e53935" stroke-width="2.5"/>
  <text x="80" y="582" font-size="13.5" font-weight="bold" fill="#b71c1c">同一个解析器上，有一个失败路径没处理干净</text>
  <text x="80" y="604" font-size="12" fill="#c62828">loadFromFile 解析失败时不清表 —— 上一次的数据留在里面，被当成这次的结果用。上层拿到的是</text>
  <text x="80" y="626" font-size="12" fill="#c62828">一份「看起来成功」的旧参数表，而且没有任何报错。修法很简单，代价是承认它曾经存在。</text>
</svg>
