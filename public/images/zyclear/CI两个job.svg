<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#546e7a"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#fafafa"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">没有相机的 CI：把降级路径跑成常态</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#666">CI 机器上没有海康 SDK，也不该有 —— 那就让「没有 SDK」成为每次推送都走一遍的路</text>

  <!-- 关键设计 -->
  <rect x="60" y="88" width="880" height="118" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
  <text x="80" y="116" font-size="14.5" font-weight="bold" fill="#e65100">这篇里最有想法的一处：HikSDK_ROOT 刻意指向不存在的路径</text>

  <rect x="80" y="130" width="400" height="58" rx="7" fill="#ffffff" stroke="#f9a825" stroke-width="1.8"/>
  <text x="96" y="152" font-size="11.5" font-family="Consolas, monospace" fill="#8d6e63">HikSDK_ROOT=/nonexistent</text>
  <text x="96" y="174" font-size="11" fill="#a1887f">workflow 与 ci-linux 预设里各写一次</text>

  <text x="512" y="152" font-size="12.5" fill="#8d6e63">结果：每次推送都会顺带覆盖「缺厂商 SDK 时降级为纯虚拟相机」这条分支。</text>
  <text x="512" y="174" font-size="12.5" font-weight="bold" fill="#e65100">降级路径因此是常态，不是出了事才想起来的例外。</text>

  <!-- 两个 job -->
  <rect x="60" y="228" width="424" height="290" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/>
  <text x="272" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">job 1 · 构建与测试</text>
  <text x="272" y="280" text-anchor="middle" font-size="11.5" fill="#64b5f6">跑在 Ubuntu —— 一条 apt 装齐，不用现场编 OpenCV</text>

  <rect x="82" y="298" width="380" height="44" rx="7" fill="#ffffff" stroke="#90caf9" stroke-width="1.7"/>
  <text x="96" y="318" font-size="11.5" fill="#1565c0">apt install qt6-base-dev libopencv-dev</text>
  <text x="96" y="334" font-size="10.5" fill="#64b5f6">依赖一次装齐</text>

  <rect x="82" y="352" width="380" height="44" rx="7" fill="#ffffff" stroke="#90caf9" stroke-width="1.7"/>
  <text x="96" y="372" font-size="11.5" fill="#1565c0">cmake --preset ci-linux</text>
  <text x="96" y="388" font-size="10.5" fill="#64b5f6">与本地同一套预设，SDK 路径指向 /nonexistent</text>

  <rect x="82" y="406" width="380" height="44" rx="7" fill="#ffffff" stroke="#90caf9" stroke-width="1.7"/>
  <text x="96" y="426" font-size="11.5" fill="#1565c0">ctest --output-on-failure</text>
  <text x="96" y="442" font-size="10.5" fill="#64b5f6">8 个测试目标全部跑通，全程不需要真机</text>

  <rect x="82" y="462" width="380" height="42" rx="7" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
  <text x="272" y="488" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b5e20">这个 job 卡合并 —— 编不过就是编不过</text>

  <!-- job 2 -->
  <rect x="516" y="228" width="424" height="290" rx="12" fill="#fff3e0" stroke="#f9a825" stroke-width="2.5"/>
  <text x="728" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">job 2 · 静态分析（clang-tidy）</text>
  <text x="728" y="280" text-anchor="middle" font-size="11.5" fill="#a1887f">continue-on-error: true —— 给报告，不卡合并</text>

  <rect x="538" y="298" width="380" height="60" rx="7" fill="#ffffff" stroke="#f9a825" stroke-width="1.7"/>
  <text x="552" y="320" font-size="11.5" font-weight="bold" fill="#e65100">为什么不卡合并</text>
  <text x="552" y="340" font-size="11" fill="#8d6e63">它比构建慢，且规则随 clang-tidy 版本演进 —— 混在构建</text>
  <text x="552" y="354" font-size="11" fill="#8d6e63">job 里，会让「代码能不能编过」被无关告警淹没</text>

  <rect x="538" y="370" width="380" height="44" rx="7" fill="#ffffff" stroke="#f9a825" stroke-width="1.7"/>
  <text x="552" y="390" font-size="11.5" fill="#8d6e63">xargs -P4 并行 —— 单文件几十秒，串行跑完 src 太久</text>
  <text x="552" y="406" font-size="10.5" fill="#a1887f">结果 tee 到日志，::notice:: 打印告警条数</text>

  <rect x="538" y="424" width="380" height="44" rx="7" fill="#ffffff" stroke="#f9a825" stroke-width="1.7"/>
  <text x="552" y="444" font-size="11.5" fill="#8d6e63">日志作为 artifact 上传（if: always()）</text>
  <text x="552" y="460" font-size="10.5" fill="#a1887f">分析失败也保留，好回头查</text>

  <rect x="538" y="478" width="380" height="28" rx="6" fill="#fffde7" stroke="#fdd835" stroke-width="1.5"/>
  <text x="728" y="497" text-anchor="middle" font-size="11" fill="#795548">要变成硬门禁时：去掉 continue-on-error，并在 .clang-tidy 加严</text>

  <!-- 底部：静态分析的三条主张 -->
  <rect x="60" y="540" width="880" height="104" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="80" y="566" font-size="13.5" font-weight="bold" fill="#37474f">.clang-tidy 里的三条主张（不是「装了个 linter」）</text>

  <rect x="80" y="578" width="270" height="54" rx="7" fill="#ffffff" stroke="#b0bec5" stroke-width="1.6"/>
  <text x="94" y="598" font-size="11.5" font-weight="bold" fill="#0d47a1">逐条白名单，不开通配</text>
  <text x="94" y="618" font-size="10.5" fill="#546e7a">指名启用，规则集升级不会突然涌入新告警</text>

  <rect x="366" y="578" width="270" height="54" rx="7" fill="#ffffff" stroke="#b0bec5" stroke-width="1.6"/>
  <text x="380" y="598" font-size="11.5" font-weight="bold" fill="#0d47a1">WarningsAsErrors: ''</text>
  <text x="380" y="618" font-size="10.5" fill="#546e7a">需要强制时命令行显式加，不卡住所有人</text>

  <rect x="652" y="578" width="268" height="54" rx="7" fill="#ffffff" stroke="#b0bec5" stroke-width="1.6"/>
  <text x="666" y="598" font-size="11.5" font-weight="bold" fill="#0d47a1">HeaderFilterRegex 限定自己写的代码</text>
  <text x="666" y="618" font-size="10.5" fill="#546e7a">不分析第三方 SDK 头文件展开出来的问题</text>
</svg>
