<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#546e7a"/>
    </marker>
    <marker id="aG" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#388e3c"/>
    </marker>
    <marker id="aR" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="1000" height="680" fill="#fafafa"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">注册按位拆开，通知却整键查找</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#666">两个函数对「事件」的理解不一致 —— 组合值因此被静默吞掉，一个订阅者都不触发</text>

  <!-- 六个事件位 -->
  <text x="60" y="100" font-size="14" font-weight="bold" fill="#37474f">六个事件各占一个独立的二进制位（不得复用）</text>

  <g font-family="Consolas, monospace">
    <rect x="60" y="116" width="140" height="56" rx="7" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.8"/>
    <text x="130" y="140" text-anchor="middle" font-size="11.5" fill="#0d47a1">ENUMRTION</text>
    <text x="130" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">1 = 000001</text>

    <rect x="216" y="116" width="140" height="56" rx="7" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.8"/>
    <text x="286" y="140" text-anchor="middle" font-size="11.5" fill="#0d47a1">CONNECT</text>
    <text x="286" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">2 = 000010</text>

    <rect x="372" y="116" width="140" height="56" rx="7" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.8"/>
    <text x="442" y="140" text-anchor="middle" font-size="11.5" fill="#0d47a1">DISCONNECT</text>
    <text x="442" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">4 = 000100</text>

    <rect x="528" y="116" width="140" height="56" rx="7" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.8"/>
    <text x="598" y="140" text-anchor="middle" font-size="11.5" fill="#0d47a1">STARTGRAB</text>
    <text x="598" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">8 = 001000</text>

    <rect x="684" y="116" width="140" height="56" rx="7" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.8"/>
    <text x="754" y="140" text-anchor="middle" font-size="11.5" fill="#0d47a1">STOPTGRAB</text>
    <text x="754" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">16 = 010000</text>

    <rect x="840" y="116" width="120" height="56" rx="7" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="900" y="140" text-anchor="middle" font-size="11.5" fill="#e65100">CAMERASWICH</text>
    <text x="900" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">32 = 100000</text>
  </g>

  <!-- 两个分支 -->
  <rect x="60" y="204" width="410" height="200" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="80" y="232" font-size="14" font-weight="bold" fill="#1b5e20">registerMessage —— 按位拆开</text>
  <text x="80" y="254" font-size="11.5" fill="#66bb6a">六个分支，每个事件各登记一份订阅</text>

  <rect x="80" y="268" width="370" height="118" rx="7" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.7"/>
  <text x="94" y="290" font-size="11.5" font-family="Consolas, monospace" fill="#1b5e20">if (msg &amp; CAMERA_CONNECT)</text>
  <text x="108" y="308" font-size="11.5" font-family="Consolas, monospace" fill="#1b5e20">    m_map[CONNECT].append(listener);</text>
  <text x="94" y="328" font-size="11.5" font-family="Consolas, monospace" fill="#1b5e20">if (msg &amp; CAMERA_DISCONNECT)</text>
  <text x="108" y="346" font-size="11.5" font-family="Consolas, monospace" fill="#1b5e20">    m_map[DISCONNECT].append(listener);</text>
  <text x="94" y="372" font-size="11" fill="#66bb6a">… 六个事件名，六次判断（缺一个就是漏拆）</text>

  <rect x="530" y="204" width="430" height="200" rx="10" fill="#ffebee" stroke="#e53935" stroke-width="2.5"/>
  <text x="550" y="232" font-size="14" font-weight="bold" fill="#b71c1c">notify —— 整键精确查找</text>
  <text x="550" y="254" font-size="11.5" fill="#ef9a9a">拿到的值原样当 key 用，不做拆分</text>

  <rect x="550" y="268" width="390" height="118" rx="7" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.7"/>
  <text x="564" y="290" font-size="11.5" font-family="Consolas, monospace" fill="#c62828">auto it = m_map.find(message);</text>
  <text x="564" y="310" font-size="11.5" font-family="Consolas, monospace" fill="#c62828">if (it != m_map.end()) {</text>
  <text x="578" y="328" font-size="11.5" font-family="Consolas, monospace" fill="#c62828">    for (auto* l : *it) l-&gt;RespondMessage(message);</text>
  <text x="564" y="346" font-size="11.5" font-family="Consolas, monospace" fill="#c62828">}</text>
  <text x="564" y="372" font-size="11" font-weight="bold" fill="#b71c1c">查不到 → 走空 else，静默吞掉，无任何报错</text>

  <!-- 后果 -->
  <rect x="60" y="428" width="880" height="106" rx="10" fill="#ffcdd2" stroke="#e53935" stroke-width="2.5"/>
  <text x="80" y="456" font-size="14" font-weight="bold" fill="#b71c1c">两者一撞，组合值就消失了</text>

  <rect x="80" y="470" width="330" height="48" rx="7" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.7"/>
  <text x="96" y="492" font-size="11.5" font-family="Consolas, monospace" fill="#c62828">notify(CONNECT | DISCONNECT)</text>
  <text x="96" y="510" font-size="11" fill="#ef9a9a">值 = 6，但表里没有 key 为 6 的条目</text>

  <line x1="410" y1="494" x2="442" y2="494" stroke="#c62828" stroke-width="2.2" marker-end="url(#aR)"/>

  <rect x="446" y="470" width="480" height="48" rx="7" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.7"/>
  <text x="462" y="492" font-size="11.5" fill="#c62828">注册过 CONNECT 和 DISCONNECT 的订阅者，</text>
  <text x="462" y="510" font-size="11.5" font-weight="bold" fill="#b71c1c">这一次通知一个都不会被触发 —— 而且没人知道</text>

  <!-- 测试 -->
  <rect x="60" y="554" width="880" height="112" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="80" y="582" font-size="14" font-weight="bold" fill="#0d47a1">这个行为被写进了一个测试，防止将来有人「顺手修好」</text>

  <rect x="80" y="596" width="840" height="56" rx="7" fill="#ffffff" stroke="#90caf9" stroke-width="1.6"/>
  <text x="96" y="618" font-size="11.5" font-family="Consolas, monospace" fill="#0d47a1">combinedNotifyValueIsSilentlyDropped</text>
  <text x="96" y="640" font-size="11.5" fill="#1565c0">把两个事件位或起来传给 notify，断言两个订阅者的计数都为 0 —— 固化的是「现状」，不是「期望」</text>
</svg>
