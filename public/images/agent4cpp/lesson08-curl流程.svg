<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#546e7a"/>
    </marker>
  </defs>

  <rect width="940" height="620" fill="#fafafa"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">寄一封信的完整流程（libcurl 的七步）</text>
  <text x="470" y="56" text-anchor="middle" font-size="12.5" fill="#666">每个 HTTP 请求都要走这一遍</text>

  <!-- 第0步 -->
  <rect x="60" y="86" width="820" height="52" rx="9" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="80" y="108" font-size="14" font-weight="bold" fill="#37474f">第 0 步：全局初始化</text>
  <text x="80" y="128" font-size="12" fill="#546e7a">curl_global_init() —— 整个程序只做一次，由 CurlApi 这个"管家"在构造时自动完成</text>
  <text x="862" y="112" text-anchor="end" font-size="11.5" fill="#90a4ae">整个程序一次</text>
  <line x1="470" y1="138" x2="470" y2="162" stroke="#546e7a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 第1步 -->
  <rect x="60" y="166" width="820" height="46" rx="9" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="80" y="188" font-size="14" font-weight="bold" fill="#0d47a1">第 1 步：创建句柄</text>
  <text x="80" y="205" font-size="12" fill="#1565c0">curl_easy_init() —— 相当于拿一个空信封</text>
  <line x1="470" y1="212" x2="470" y2="236" stroke="#546e7a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 第2步 -->
  <rect x="60" y="240" width="820" height="96" rx="9" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="80" y="262" font-size="14" font-weight="bold" fill="#e65100">第 2 步：往信封上挂设置（curl_easy_setopt 调一堆）</text>
  <text x="80" y="284" font-size="12" fill="#8d6e63">CURLOPT_URL              寄到哪</text>
  <text x="80" y="302" font-size="12" fill="#8d6e63">CURLOPT_HTTPHEADER       信头（Content-Type、Authorization）</text>
  <text x="80" y="320" font-size="12" fill="#8d6e63">CURLOPT_POSTFIELDS       信的内容（JSON 文本）</text>
  <text x="520" y="284" font-size="12" fill="#8d6e63">CURLOPT_WRITEFUNCTION    收信员（回调函数）</text>
  <text x="520" y="302" font-size="12" fill="#8d6e63">CURLOPT_TIMEOUT_MS       等多久算超时</text>
  <text x="520" y="320" font-size="12" fill="#8d6e63">CURLOPT_CAINFO           证书路径（验证对面身份）</text>
  <line x1="470" y1="336" x2="470" y2="360" stroke="#546e7a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 第3步：执行 + 回调 -->
  <rect x="60" y="364" width="820" height="106" rx="9" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="80" y="386" font-size="14" font-weight="bold" fill="#1b5e20">第 3 步：执行！curl_easy_perform() —— 真正寄出去，阻塞等回信</text>
  <text x="80" y="410" font-size="12" fill="#2e7d32">回信不是一次到齐的，是【一块一块】来的。每来一块，libcurl 就调一次你的收信员：</text>

  <!-- 回调示意 -->
  <rect x="100" y="420" width="150" height="36" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="175" y="443" text-anchor="middle" font-size="11.5" fill="#1b5e20">第 1 块到达</text>
  <line x1="250" y1="438" x2="278" y2="438" stroke="#388e3c" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="282" y="420" width="180" height="36" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="372" y="443" text-anchor="middle" font-size="11.5" fill="#1b5e20">WriteBodyCallback 收到</text>
  <line x1="462" y1="438" x2="490" y2="438" stroke="#388e3c" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="494" y="420" width="200" height="36" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="594" y="443" text-anchor="middle" font-size="11.5" fill="#1b5e20">追加到 response_body 字符串</text>
  <text x="712" y="443" font-size="11.5" fill="#2e7d32">……反复，直到收完</text>
  <line x1="470" y1="470" x2="470" y2="494" stroke="#546e7a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 第4-6步 -->
  <rect x="60" y="498" width="820" height="66" rx="9" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="80" y="520" font-size="14" font-weight="bold" fill="#37474f">第 4~6 步：收尾</text>
  <text x="80" y="540" font-size="12" fill="#546e7a">curl_easy_getinfo(RESPONSE_CODE) 问状态码　→　释放信头链表　→　销毁句柄</text>
  <text x="80" y="557" font-size="12" fill="#546e7a">然后判断：传输成功了吗？状态码是 2xx 吗？</text>

  <!-- 右侧编号提示 -->
  <text x="900" y="190" text-anchor="end" font-size="11.5" fill="#1976d2">每个请求一次</text>
  <text x="900" y="392" text-anchor="end" font-size="11.5" fill="#2e7d32">耗时都在这里</text>
</svg>
