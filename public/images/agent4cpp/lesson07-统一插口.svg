<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#546e7a"/>
    </marker>
    <marker id="aH" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#f9a825"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">一个插口，两种助手</text>
  <text x="450" y="56" text-anchor="middle" font-size="12.5" fill="#666">Agent 只认插口，不关心插进来的是谁 —— 这就是"能换模型"的原理</text>

  <!-- 插口 -->
  <rect x="290" y="90" width="320" height="86" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
  <text x="450" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#e65100">ILLMClient</text>
  <text x="450" y="140" text-anchor="middle" font-size="13" fill="#8d6e63">统一插口（抽象接口）</text>
  <text x="450" y="162" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#a1887f">ChatResponse Chat(ChatRequest)</text>

  <!-- 插口向下分出两个实现 -->
  <line x1="370" y1="176" x2="220" y2="244" stroke="#546e7a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="530" y1="176" x2="680" y2="244" stroke="#546e7a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="242" y="194" font-size="12" fill="#78909c">实现它</text>
  <text x="628" y="194" font-size="12" fill="#78909c">实现它</text>

  <!-- 假助手 -->
  <rect x="60" y="248" width="320" height="130" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="220" y="274" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">MockLLMClient</text>
  <text x="220" y="296" text-anchor="middle" font-size="13" fill="#2e7d32">假助手（背台词的演员）</text>
  <text x="80" y="322" font-size="12.5" fill="#2e7d32">• 不联网、不花钱、不用 Key</text>
  <text x="80" y="342" font-size="12.5" fill="#2e7d32">• 你提前把台词排进队列</text>
  <text x="80" y="362" font-size="12.5" fill="#2e7d32">• 每次问，按顺序念一条</text>

  <!-- 真助手 -->
  <rect x="520" y="248" width="320" height="130" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/>
  <text x="680" y="274" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">OpenAICompatible…</text>
  <text x="680" y="296" text-anchor="middle" font-size="13" fill="#1565c0">真助手（联网问模型）</text>
  <text x="540" y="322" font-size="12.5" fill="#1565c0">• 调 DeepSeek / OpenAI 接口</text>
  <text x="540" y="342" font-size="12.5" fill="#1565c0">• 需要 API Key 和网络</text>
  <text x="540" y="362" font-size="12.5" fill="#1565c0">• 会思考，回答不固定</text>

  <!-- Agent 从下面插进来 -->
  <line x1="450" y1="436" x2="450" y2="368" stroke="#f9a825" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#aH)"/>
  <rect x="300" y="440" width="300" height="56" rx="10" fill="#fff3e0" stroke="#f9a825" stroke-width="2.5"/>
  <text x="450" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">Agent（调度员）</text>
  <text x="450" y="484" text-anchor="middle" font-size="12" fill="#8d6e63">只认 ILLMClient，不认具体是谁</text>

  <!-- 右侧说明 -->
  <text x="450" y="106" text-anchor="middle" font-size="0" fill="#fff">.</text>
</svg>
