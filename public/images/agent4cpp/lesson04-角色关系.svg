<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="920" height="700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#546e7a"/>
    </marker>
    <marker id="aHi" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#f9a825"/>
    </marker>
    <marker id="aGr" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#388e3c"/>
    </marker>
  </defs>

  <rect width="920" height="700" fill="#fafafa"/>

  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Tool 模块里谁是谁</text>
  <text x="460" y="56" text-anchor="middle" font-size="12.5" fill="#666">从你写的两行代码，到助手收到工具清单 —— 中间经过哪些角色</text>

  <!-- 第一层 -->
  <rect x="60" y="76" width="800" height="78" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2.5"/>
  <text x="80" y="100" font-size="15" font-weight="bold" fill="#283593">① 你写的两行代码（课 03 的宏）</text>
  <text x="80" y="122" font-size="12" font-family="Consolas, monospace" fill="#3949ab">AGENT4CPP_TOOL(set_exposure, "设置相机曝光时间。") { ... }</text>
  <text x="80" y="142" font-size="12" font-family="Consolas, monospace" fill="#3949ab">AGENT4CPP_REGISTER_FUNCTION(registry, set_exposure, "...", AGENT4CPP_DOUBLE_ARG(...))</text>

  <line x1="280" y1="154" x2="280" y2="196" stroke="#546e7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="294" y="180" font-size="12" fill="#546e7a">宏展开（课 03）</text>
  <line x1="660" y1="154" x2="660" y2="196" stroke="#546e7a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 第二层 -->
  <rect x="70" y="200" width="400" height="84" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="90" y="224" font-size="15" font-weight="bold" fill="#1b5e20">② 一个普通的 C++ 函数</text>
  <text x="90" y="246" font-size="12" font-family="Consolas, monospace" fill="#66bb6a">set_exposure</text>
  <text x="90" y="266" font-size="12.5" fill="#2e7d32">里面是【你写的业务代码】</text>
  <text x="90" y="282" font-size="12.5" fill="#2e7d32">比如调相机、设曝光</text>

  <rect x="510" y="200" width="400" height="84" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2.5"/>
  <text x="530" y="224" font-size="15" font-weight="bold" fill="#283593">③ 工具资料卡</text>
  <text x="530" y="246" font-size="12" font-family="Consolas, monospace" fill="#7986cb">ToolDefinition</text>
  <text x="530" y="266" font-size="12.5" fill="#3949ab">名字、说明、参数要求单</text>
  <text x="530" y="282" font-size="12.5" fill="#3949ab">还有"谁来执行"</text>

  <line x1="510" y1="250" x2="478" y2="250" stroke="#388e3c" stroke-width="2.5" marker-end="url(#aGr)"/>
  <text x="494" y="232" text-anchor="middle" font-size="11" fill="#388e3c">invoker</text>

  <line x1="710" y1="284" x2="710" y2="324" stroke="#546e7a" stroke-width="2" marker-end="url(#a)"/>
  <text x="722" y="308" font-size="12" fill="#546e7a">注册进登记处</text>

  <!-- 第三层 -->
  <rect x="60" y="330" width="380" height="84" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="80" y="354" font-size="15" font-weight="bold" fill="#e65100">⑦ 抄录员</text>
  <text x="420" y="354" text-anchor="end" font-size="12" font-weight="bold" fill="#f9a825">课04·部分5</text>
  <text x="80" y="376" font-size="12" font-family="Consolas, monospace" fill="#a1887f">GetRequiredDouble</text>
  <text x="80" y="396" font-size="12.5" fill="#8d6e63">②那个函数内部用它</text>
  <text x="80" y="412" font-size="12.5" fill="#8d6e63">从 JSON 抄值到 C++ 变量</text>
  <line x1="250" y1="330" x2="250" y2="288" stroke="#f9a825" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aHi)"/>

  <rect x="470" y="330" width="400" height="84" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="2.5"/>
  <text x="490" y="354" font-size="15" font-weight="bold" fill="#263238">④ 登记处</text>
  <text x="850" y="354" text-anchor="end" font-size="12" font-weight="bold" fill="#90a4ae">课05</text>
  <text x="490" y="376" font-size="12" font-family="Consolas, monospace" fill="#78909c">ToolRegistry</text>
  <text x="490" y="396" font-size="12.5" fill="#546e7a">存着所有工具的资料卡</text>
  <text x="490" y="412" font-size="12.5" fill="#546e7a">提供"查"和"执行"</text>

  <line x1="560" y1="414" x2="300" y2="474" stroke="#f9a825" stroke-width="2.5" marker-end="url(#aHi)"/>
  <line x1="790" y1="414" x2="710" y2="474" stroke="#f9a825" stroke-width="2.5" marker-end="url(#aHi)"/>

  <!-- 第四层 -->
  <rect x="60" y="480" width="420" height="88" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="80" y="504" font-size="15" font-weight="bold" fill="#e65100">⑤ 翻译官</text>
  <text x="460" y="504" text-anchor="end" font-size="12" font-weight="bold" fill="#f9a825">课04·部分3</text>
  <text x="80" y="526" font-size="12" font-family="Consolas, monospace" fill="#a1887f">BuildOpenAIToolSchema</text>
  <text x="80" y="546" font-size="12.5" fill="#8d6e63">把资料卡翻译成 JSON</text>
  <text x="80" y="562" font-size="12.5" fill="#8d6e63">发给助手当"说明书"</text>

  <rect x="510" y="480" width="420" height="88" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="530" y="504" font-size="15" font-weight="bold" fill="#e65100">⑥ 安检员</text>
  <text x="910" y="504" text-anchor="end" font-size="12" font-weight="bold" fill="#f9a825">课04·部分4</text>
  <text x="530" y="526" font-size="12" font-family="Consolas, monospace" fill="#a1887f">ValidateArguments</text>
  <text x="530" y="546" font-size="12.5" fill="#8d6e63">检查助手给的参数格式</text>
  <text x="530" y="562" font-size="12.5" fill="#8d6e63">不合格就退回给它自己改</text>

  <line x1="200" y1="568" x2="200" y2="614" stroke="#1976d2" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="70" y="618" width="280" height="46" rx="9" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/>
  <text x="210" y="647" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">发给助手（大模型）</text>

  <line x1="720" y1="568" x2="720" y2="614" stroke="#388e3c" stroke-width="2.5" marker-end="url(#aGr)"/>
  <rect x="530" y="618" width="380" height="46" rx="9" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="720" y="647" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">通过 → 调用②那个函数真正干活</text>
</svg>
