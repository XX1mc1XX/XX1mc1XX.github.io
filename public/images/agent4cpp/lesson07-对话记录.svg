<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <rect width="980" height="640" fill="#fafafa"/>

  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">对话记录是怎么一轮轮长起来的</text>
  <text x="490" y="54" text-anchor="middle" font-size="12.5" fill="#666">每轮都把【到目前为止的全部消息】发给助手 —— 因为模型本身不记事儿</text>

  <!-- 图例 -->
  <rect x="60" y="70" width="16" height="16" rx="3" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5"/>
  <text x="84" y="84" font-size="12.5" fill="#1565c0">用户说的</text>
  <rect x="180" y="70" width="16" height="16" rx="3" fill="#ffe0b2" stroke="#f9a825" stroke-width="1.5"/>
  <text x="204" y="84" font-size="12.5" fill="#e65100">助手说的</text>
  <rect x="300" y="70" width="16" height="16" rx="3" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="324" y="84" font-size="12.5" fill="#2e7d32">工具执行结果</text>

  <!-- ============ 第1轮 ============ -->
  <text x="70" y="126" font-size="14" font-weight="bold" fill="#37474f">第 1 轮</text>
  <text x="70" y="146" font-size="11.5" fill="#78909c">用户: 图像有点暗</text>

  <rect x="76" y="160" width="180" height="40" rx="6" fill="#bbdefb" stroke="#1976d2" stroke-width="2"/>
  <text x="166" y="185" text-anchor="middle" font-size="12.5" fill="#0d47a1">user: "图像有点暗"</text>

  <!-- 箭头 -->
  <line x1="266" y1="180" x2="306" y2="180" stroke="#90a4ae" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 在第1轮右边画助手回应 -->
  <rect x="320" y="160" width="220" height="40" rx="6" fill="#ffe0b2" stroke="#f9a825" stroke-width="2"/>
  <text x="430" y="180" text-anchor="middle" font-size="12" fill="#e65100">助手: 我要调 get_camera_status</text>
  <text x="430" y="194" text-anchor="middle" font-size="10.5" fill="#a1887f">tool_call = 有</text>

  <!-- ============ 第2轮 ============ -->
  <text x="70" y="246" font-size="14" font-weight="bold" fill="#37474f">第 2 轮</text>
  <text x="70" y="266" font-size="11.5" fill="#78909c">把工具结果塞回去，再问一次</text>

  <rect x="76" y="280" width="180" height="34" rx="6" fill="#bbdefb" stroke="#1976d2" stroke-width="1.8"/>
  <text x="166" y="302" text-anchor="middle" font-size="12" fill="#0d47a1">user: "图像有点暗"</text>

  <rect x="76" y="320" width="180" height="34" rx="6" fill="#ffe0b2" stroke="#f9a825" stroke-width="1.8"/>
  <text x="166" y="342" text-anchor="middle" font-size="12" fill="#e65100">assistant: 要调工具</text>

  <rect x="76" y="360" width="180" height="34" rx="6" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.8"/>
  <text x="166" y="382" text-anchor="middle" font-size="12" fill="#1b5e20">tool: brightness=0.5</text>

  <line x1="266" y1="340" x2="306" y2="340" stroke="#90a4ae" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="320" y="320" width="220" height="40" rx="6" fill="#ffe0b2" stroke="#f9a825" stroke-width="2"/>
  <text x="430" y="340" text-anchor="middle" font-size="12" fill="#e65100">助手: 我要调 set_exposure</text>
  <text x="430" y="354" text-anchor="middle" font-size="10.5" fill="#a1887f">tool_call = 有</text>

  <!-- ============ 第3轮 ============ -->
  <text x="70" y="436" font-size="14" font-weight="bold" fill="#37474f">第 3 轮</text>
  <text x="70" y="456" font-size="11.5" fill="#78909c">再塞回结果，再问</text>

  <rect x="76" y="470" width="180" height="28" rx="6" fill="#bbdefb" stroke="#1976d2" stroke-width="1.6"/>
  <text x="166" y="489" text-anchor="middle" font-size="11.5" fill="#0d47a1">user</text>

  <rect x="76" y="502" width="180" height="28" rx="6" fill="#ffe0b2" stroke="#f9a825" stroke-width="1.6"/>
  <text x="166" y="521" text-anchor="middle" font-size="11.5" fill="#e65100">assistant (要调工具)</text>

  <rect x="76" y="534" width="180" height="28" rx="6" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.6"/>
  <text x="166" y="553" text-anchor="middle" font-size="11.5" fill="#1b5e20">tool (亮度 0.5)</text>

  <rect x="76" y="566" width="180" height="28" rx="6" fill="#ffe0b2" stroke="#f9a825" stroke-width="1.6"/>
  <text x="166" y="585" text-anchor="middle" font-size="11.5" fill="#e65100">assistant (要调工具)</text>

  <rect x="76" y="598" width="180" height="28" rx="6" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.6"/>
  <text x="166" y="617" text-anchor="middle" font-size="11.5" fill="#1b5e20">tool (曝光已更新)</text>

  <line x1="266" y1="540" x2="306" y2="540" stroke="#90a4ae" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="320" y="518" width="240" height="68" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="440" y="540" text-anchor="middle" font-size="12" fill="#1b5e20">助手: "搞定了，我把曝光</text>
  <text x="440" y="557" text-anchor="middle" font-size="12" fill="#1b5e20">调到 8000 了"</text>
  <text x="440" y="577" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">tool_call = 无 → 循环结束</text>

  <!-- 右侧说明块 -->
  <rect x="600" y="440" width="330" height="186" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.8"/>
  <text x="620" y="466" font-size="13.5" font-weight="bold" fill="#37474f">三个要点</text>
  <text x="620" y="492" font-size="12" fill="#546e7a">① 每轮都发【全部】消息，不是只发新的</text>
  <text x="636" y="510" font-size="11.5" fill="#78909c">模型是无状态的，不记着上次说了啥</text>

  <text x="620" y="538" font-size="12" fill="#546e7a">② 工具结果也是一条消息（role=tool）</text>
  <text x="636" y="556" font-size="11.5" fill="#78909c">带上 tool_call_id，模型才知道对应哪次</text>

  <text x="620" y="584" font-size="12" fill="#546e7a">③ 终点的判断只看 tool_call</text>
  <text x="636" y="602" font-size="11.5" fill="#78909c">有 → 继续；没有 → 助手说完了</text>

  <!-- 中间长出来的箭头 -->
  <line x1="30" y1="180" x2="30" y2="612" stroke="#b0bec5" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="22" y="400" font-size="12" fill="#90a4ae" transform="rotate(-90 22 400)" text-anchor="middle">消息越堆越多</text>
</svg>
