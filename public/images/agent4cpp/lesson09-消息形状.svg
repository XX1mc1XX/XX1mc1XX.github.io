<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" width="940" height="660" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="940" height="660" fill="#fafafa"/>

  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">同一条消息，按角色写成不同形状</text>
  <text x="470" y="54" text-anchor="middle" font-size="12.5" fill="#666">这就是 MessageToJson 那个函数在干的事 —— 按角色拼不同字段</text>

  <!-- ① 普通消息 -->
  <rect x="40" y="76" width="860" height="112" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="60" y="100" font-size="14.5" font-weight="bold" fill="#0d47a1">① 用户 / 系统消息 —— 最简单</text>
  <text x="60" y="124" font-size="12" fill="#1565c0">只有两个字段，内容原样塞进去就行</text>
  <rect x="60" y="136" width="600" height="38" rx="5" fill="#fff" stroke="#90caf9" stroke-width="1.5"/>
  <text x="74" y="160" font-size="12.5" font-family="Consolas, monospace" fill="#0d47a1">{"role":"user", "content":"图像有点暗"}</text>
  <text x="680" y="160" font-size="11.5" fill="#1976d2">课 09 的普通分支</text>

  <!-- ② 工具结果 -->
  <rect x="40" y="200" width="860" height="118" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="60" y="224" font-size="14.5" font-weight="bold" fill="#1b5e20">② 工具结果消息 —— 必须带 tool_call_id</text>
  <text x="60" y="248" font-size="12" fill="#2e7d32">模型可能一次要调好几个工具，得靠这个编号知道"这条结果对应哪一次调用"</text>
  <rect x="60" y="260" width="600" height="44" rx="5" fill="#fff" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="74" y="278" font-size="12.5" font-family="Consolas, monospace" fill="#1b5e20">{"role":"tool",</text>
  <text x="74" y="296" font-size="12.5" font-family="Consolas, monospace" fill="#1b5e20"> "tool_call_id":"call_3d57...", "content":"亮度 0.5"}</text>
  <text x="680" y="285" font-size="11.5" fill="#388e3c">tool 分支</text>

  <!-- ③ 助手消息 -->
  <rect x="40" y="330" width="860" height="310" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="60" y="354" font-size="14.5" font-weight="bold" fill="#e65100">③ 助手消息 —— 又分三种情况（本课的重点）</text>

  <!-- 3a -->
  <rect x="60" y="368" width="820" height="76" rx="7" fill="#fffde7" stroke="#fdd835" stroke-width="1.5"/>
  <text x="76" y="390" font-size="13" font-weight="bold" fill="#f57f17">a) 只是说话</text>
  <text x="76" y="414" font-size="12.5" font-family="Consolas, monospace" fill="#795548">{"role":"assistant", "content":"好的"}</text>
  <text x="640" y="400" font-size="11.5" fill="#f57f17">→ 循环会结束</text>

  <!-- 3b -->
  <rect x="60" y="452" width="820" height="80" rx="7" fill="#fffde7" stroke="#fdd835" stroke-width="1.5"/>
  <text x="76" y="474" font-size="13" font-weight="bold" fill="#f57f17">b) 还带推理过程（思考模型才有）</text>
  <text x="76" y="498" font-size="12.5" font-family="Consolas, monospace" fill="#795548">{..., "reasoning_content":"用户说图像暗，我应该先查相机状态..."}</text>
  <text x="76" y="520" font-size="11.5" fill="#c62828">★ 这段必须原样回传！短对话不校验，长对话每个请求都 400（面试素材 B）</text>

  <!-- 3c -->
  <rect x="60" y="540" width="820" height="86" rx="7" fill="#fff3e0" stroke="#f9a825" stroke-width="2"/>
  <text x="76" y="562" font-size="13" font-weight="bold" fill="#e65100">c) 要调工具</text>
  <text x="76" y="584" font-size="12" font-family="Consolas, monospace" fill="#8d6e63">{..., "tool_calls":[{"id":"call_3d57...", "type":"function",</text>
  <text x="76" y="602" font-size="12" font-family="Consolas, monospace" fill="#8d6e63">   "function":{"name":"get_camera_status", "arguments":"{}"}}]}</text>
  <text x="76" y="620" font-size="11.5" font-weight="bold" fill="#e65100">★ 有 tool_calls 就是循环继续的信号；注意 arguments 是【字符串】不是对象</text>
</svg>
