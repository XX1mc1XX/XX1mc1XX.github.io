<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="940" height="560" fill="#fafafa"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">为什么用 shared_mutex 而不是 mutex</text>
  <text x="470" y="56" text-anchor="middle" font-size="12.5" fill="#666">这是面试 Q4 的答案：看这个类的实际访问模式</text>

  <!-- 访问模式 -->
  <rect x="30" y="76" width="880" height="96" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="50" y="100" font-size="15" font-weight="bold" fill="#0d47a1">先看这个类的实际访问模式</text>
  <text x="50" y="126" font-size="13" fill="#1565c0">写（Register 注册工具）：<tspan font-weight="bold">启动时一次性做完</tspan>，之后几乎不再写</text>
  <text x="50" y="150" font-size="13" fill="#1565c0">读（ListTools / Find / Call 里的查找）：<tspan font-weight="bold">每轮对话都要调，而且可能多个线程同时调</tspan></text>

  <!-- mutex -->
  <rect x="30" y="188" width="880" height="170" rx="10" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="50" y="212" font-size="15" font-weight="bold" fill="#b71c1c">✗ 普通 mutex：读和读之间也互斥</text>

  <text x="60" y="244" font-size="12" fill="#546e7a">线程1（读）</text>
  <rect x="150" y="232" width="180" height="18" rx="4" fill="#ef9a9a" stroke="#e53935" stroke-width="1.5"/>
  <text x="60" y="272" font-size="12" fill="#546e7a">线程2（读）</text>
  <rect x="150" y="260" width="180" height="18" rx="4" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="336" y="274" font-size="11.5" fill="#c62828">← 明明只是读，也得排队等</text>
  <rect x="330" y="260" width="180" height="18" rx="4" fill="#ef9a9a" stroke="#e53935" stroke-width="1.5"/>
  <text x="60" y="300" font-size="12" fill="#546e7a">线程3（读）</text>
  <rect x="150" y="288" width="360" height="18" rx="4" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5"/>
  <rect x="510" y="288" width="180" height="18" rx="4" fill="#ef9a9a" stroke="#e53935" stroke-width="1.5"/>
  <text x="60" y="336" font-size="12.5" fill="#c62828">三个线程读同一份数据，被强行串成一条线，白白浪费并发能力</text>

  <!-- shared_mutex -->
  <rect x="30" y="372" width="880" height="170" rx="10" fill="#f1f8e9" stroke="#7cb342" stroke-width="2"/>
  <text x="50" y="396" font-size="15" font-weight="bold" fill="#33691e">✓ shared_mutex：读可以并发，读写互斥</text>

  <text x="60" y="428" font-size="12" fill="#546e7a">线程1（读）</text>
  <rect x="150" y="416" width="360" height="18" rx="4" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5"/>
  <text x="60" y="456" font-size="12" fill="#546e7a">线程2（读）</text>
  <rect x="150" y="444" width="360" height="18" rx="4" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5"/>
  <text x="60" y="484" font-size="12" fill="#546e7a">线程3（读）</text>
  <rect x="150" y="472" width="360" height="18" rx="4" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5"/>
  <text x="520" y="446" font-size="11.5" fill="#2e7d32">← 三个读同时进行</text>

  <text x="60" y="516" font-size="12" fill="#546e7a">写（注册）</text>
  <rect x="150" y="504" width="360" height="18" rx="4" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="152" y="518" font-size="11" fill="#78909c">等所有读结束</text>
  <rect x="510" y="504" width="150" height="18" rx="4" fill="#ffcc80" stroke="#f9a825" stroke-width="1.5"/>
  <text x="668" y="518" font-size="11.5" fill="#e65100">← 写独占</text>

  <!-- 对应代码 -->
  <rect x="30" y="552" width="880" height="0" rx="0" fill="none"/>
  <text x="30" y="552" font-size="0" fill="#fff">.</text>
</svg>
