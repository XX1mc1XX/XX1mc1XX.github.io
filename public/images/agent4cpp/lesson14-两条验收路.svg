<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#546e7a"/>
    </marker>
  </defs>

  <rect width="980" height="540" fill="#fafafa"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">两条验收路：假模型守逻辑，真模型守契约</text>
  <text x="490" y="56" text-anchor="middle" font-size="12.5" fill="#666">同一个 Agent，同一个入口，分叉出两次验证</text>

  <!-- 分叉起点 -->
  <rect x="40" y="238" width="120" height="62" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="100" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37474f">同一个 Agent</text>
  <text x="100" y="282" text-anchor="middle" font-size="11" fill="#78909c">同一个入口</text>

  <line x1="160" y1="269" x2="200" y2="269" stroke="#546e7a" stroke-width="2.5"/>
  <line x1="200" y1="150" x2="200" y2="392" stroke="#546e7a" stroke-width="2.5"/>
  <line x1="200" y1="150" x2="228" y2="150" stroke="#546e7a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="200" y1="392" x2="228" y2="392" stroke="#546e7a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- ============ 上路：真模型 ============ -->
  <rect x="232" y="84" width="716" height="132" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.4"/>
  <text x="252" y="112" font-size="14.5" font-weight="bold" fill="#0d47a1">真模型这条路</text>
  <text x="252" y="132" font-size="11.5" fill="#64b5f6">交付前跑一次就够了</text>

  <rect x="252" y="146" width="120" height="52" rx="7" fill="#ffffff" stroke="#90caf9" stroke-width="1.8"/>
  <text x="312" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#37474f">Agent + 工具</text>
  <text x="312" y="186" text-anchor="middle" font-size="10.5" fill="#90a4ae">和下面一模一样</text>
  <line x1="372" y1="172" x2="404" y2="172" stroke="#546e7a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="408" y="146" width="164" height="52" rx="7" fill="#1565c0" stroke="#0d47a1" stroke-width="2.2"/>
  <text x="490" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">真实大模型</text>
  <text x="490" y="186" text-anchor="middle" font-size="10.5" fill="#bbdefb">联网 · 要 Key · 花钱</text>
  <line x1="572" y1="172" x2="604" y2="172" stroke="#546e7a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="608" y="146" width="320" height="52" rx="7" fill="#ffffff" stroke="#90caf9" stroke-width="1.8"/>
  <text x="768" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">验的是「契约」</text>
  <text x="768" y="186" text-anchor="middle" font-size="11" fill="#1565c0">Schema 和提示词，在真模型上真的有效吗</text>

  <!-- ============ 下路：假模型 ============ -->
  <rect x="232" y="326" width="716" height="132" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.4"/>
  <text x="252" y="354" font-size="14.5" font-weight="bold" fill="#1b5e20">假模型这条路</text>
  <text x="252" y="374" font-size="11.5" fill="#66bb6a">每次改代码都跑，0.22 秒出结果</text>

  <rect x="252" y="388" width="120" height="52" rx="7" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.8"/>
  <text x="312" y="410" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#37474f">Agent + 工具</text>
  <text x="312" y="428" text-anchor="middle" font-size="10.5" fill="#90a4ae">一行不改</text>
  <line x1="372" y1="414" x2="404" y2="414" stroke="#546e7a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="408" y="388" width="164" height="52" rx="7" fill="#388e3c" stroke="#1b5e20" stroke-width="2.2"/>
  <text x="490" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">MockLLMClient</text>
  <text x="490" y="428" text-anchor="middle" font-size="10.5" fill="#c8e6c9">离线 · 无 Key · 0 花费</text>
  <line x1="572" y1="414" x2="604" y2="414" stroke="#546e7a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="608" y="388" width="320" height="52" rx="7" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.8"/>
  <text x="768" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">验的是「逻辑」</text>
  <text x="768" y="428" text-anchor="middle" font-size="11" fill="#2e7d32">循环 / 参数校验 / 失败回灌 / 兜底</text>

  <!-- 锁 -->
  <g>
    <rect x="882" y="252" width="34" height="26" rx="5" fill="#ffd54f" stroke="#f9a825" stroke-width="1.8"/>
    <path d="M 889 252 L 889 242 A 10 10 0 0 1 909 242 L 909 252" fill="none" stroke="#f9a825" stroke-width="2.5"/>
    <text x="899" y="296" text-anchor="middle" font-size="10.5" fill="#8d6e63">锁契约</text>

    <rect x="882" y="252" width="0" height="0"/>
  </g>

  <!-- 底部 -->
  <rect x="60" y="482" width="860" height="42" rx="9" fill="#eceff1" stroke="#90a4ae" stroke-width="1.8"/>
  <text x="490" y="508" text-anchor="middle" font-size="12.5" fill="#37474f">假模型证明我写的逻辑是对的；真模型证明模型认不认我的设计 —— 少一条都不算验完</text>
</svg>
