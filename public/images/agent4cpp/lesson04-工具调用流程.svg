<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1040" width="900" height="1040" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#546e7a"/>
    </marker>
    <marker id="arwHi" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#f9a825"/>
    </marker>
  </defs>

  <rect width="900" height="1040" fill="#fafafa"/>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">一次工具调用的完整流程</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#666">黄色 = 本课（课 04）要写的部分　　蓝色 = 大模型　　绿色 = 你的代码</text>

  <!-- 1 -->
  <rect x="230" y="84" width="440" height="58" rx="9" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="250" y="106" font-size="16" font-weight="bold" fill="#263238">① 用户说了一句人话</text>
  <text x="250" y="128" font-size="12.5" fill="#546e7a">"图像有点暗"</text>
  <line x1="450" y1="142" x2="450" y2="170" stroke="#546e7a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 2 -->
  <rect x="230" y="174" width="440" height="58" rx="9" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="250" y="196" font-size="16" font-weight="bold" fill="#263238">② 调度员把两样东西打包</text>
  <text x="250" y="218" font-size="12.5" fill="#546e7a">工具清单 + 用户的话</text>
  <line x1="450" y1="232" x2="450" y2="258" stroke="#f9a825" stroke-width="2.5" marker-end="url(#arwHi)"/>

  <!-- 3 翻译官 -->
  <rect x="230" y="262" width="440" height="70" rx="9" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="250" y="284" font-size="16" font-weight="bold" fill="#e65100">③ 翻译官</text>
  <text x="650" y="284" text-anchor="end" font-size="13" font-weight="bold" fill="#f9a825">课04·部分3</text>
  <text x="250" y="304" font-size="12" font-family="Consolas, monospace" fill="#a1887f">BuildOpenAIToolSchema</text>
  <text x="250" y="324" font-size="12.5" fill="#8d6e63">把资料卡翻译成 JSON，发给助手当说明书</text>
  <line x1="450" y1="332" x2="450" y2="358" stroke="#546e7a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 4 助手 -->
  <rect x="230" y="362" width="440" height="70" rx="9" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/>
  <text x="250" y="384" font-size="16" font-weight="bold" fill="#0d47a1">④ 助手看完说明书</text>
  <text x="250" y="404" font-size="12.5" fill="#1565c0">"我要调 set_exposure，参数 8000"</text>
  <text x="250" y="424" font-size="12.5" fill="#1565c0">它只输出文字，没碰过你的设备</text>
  <line x1="450" y1="432" x2="450" y2="458" stroke="#f9a825" stroke-width="2.5" marker-end="url(#arwHi)"/>

  <!-- 5 安检员 -->
  <rect x="230" y="462" width="440" height="70" rx="9" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="250" y="484" font-size="16" font-weight="bold" fill="#e65100">⑤ 安检员</text>
  <text x="650" y="484" text-anchor="end" font-size="13" font-weight="bold" fill="#f9a825">课04·部分4</text>
  <text x="250" y="504" font-size="12" font-family="Consolas, monospace" fill="#a1887f">ValidateArguments</text>
  <text x="250" y="524" font-size="12.5" fill="#8d6e63">检查格式：能读吗、少没少、类型对吗</text>
  <line x1="450" y1="532" x2="450" y2="558" stroke="#546e7a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 6 登记处 -->
  <rect x="230" y="562" width="440" height="70" rx="9" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="250" y="584" font-size="16" font-weight="bold" fill="#263238">⑥ 登记处找到资料卡</text>
  <text x="650" y="584" text-anchor="end" font-size="13" font-weight="bold" fill="#90a4ae">课05</text>
  <text x="250" y="604" font-size="12" font-family="Consolas, monospace" fill="#78909c">ToolRegistry</text>
  <text x="250" y="624" font-size="12.5" fill="#546e7a">按名字 "set_exposure" 查</text>
  <line x1="450" y1="632" x2="450" y2="658" stroke="#f9a825" stroke-width="2.5" marker-end="url(#arwHi)"/>

  <!-- 7 抄录员 -->
  <rect x="230" y="662" width="440" height="70" rx="9" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="250" y="684" font-size="16" font-weight="bold" fill="#e65100">⑦ 抄录员</text>
  <text x="650" y="684" text-anchor="end" font-size="13" font-weight="bold" fill="#f9a825">课04·部分5</text>
  <text x="250" y="704" font-size="12" font-family="Consolas, monospace" fill="#a1887f">GetRequiredDouble</text>
  <text x="250" y="724" font-size="12.5" fill="#8d6e63">从 JSON 里把 8000 抄进 C++ 变量</text>
  <line x1="450" y1="732" x2="450" y2="758" stroke="#546e7a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 8 你的代码 -->
  <rect x="230" y="762" width="440" height="70" rx="9" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="250" y="784" font-size="16" font-weight="bold" fill="#1b5e20">⑧ 你的代码真正执行</text>
  <text x="250" y="804" font-size="12" font-family="Consolas, monospace" fill="#66bb6a">camera-&gt;setExposure(8000)</text>
  <text x="250" y="824" font-size="12.5" fill="#2e7d32">设备真的被改了，助手全程没参与这步</text>
  <line x1="450" y1="832" x2="450" y2="858" stroke="#f9a825" stroke-width="2.5" marker-end="url(#arwHi)"/>

  <!-- 9 回执 -->
  <rect x="230" y="862" width="440" height="70" rx="9" fill="#fff8e1" stroke="#f9a825" stroke-width="2.5"/>
  <text x="250" y="884" font-size="16" font-weight="bold" fill="#e65100">⑨ 回执填写器</text>
  <text x="650" y="884" text-anchor="end" font-size="13" font-weight="bold" fill="#f9a825">课04·部分5</text>
  <text x="250" y="904" font-size="12" font-family="Consolas, monospace" fill="#a1887f">OkToolResult</text>
  <text x="250" y="924" font-size="12.5" fill="#8d6e63">状态 + 一句人话 + 结构化数据</text>
  <line x1="450" y1="932" x2="450" y2="958" stroke="#546e7a" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 10 -->
  <rect x="230" y="962" width="440" height="52" rx="9" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/>
  <text x="450" y="986" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">⑩ 回执塞回上下文</text>
  <text x="450" y="1006" text-anchor="middle" font-size="12.5" fill="#1565c0">助手看到结果，决定下一步</text>
</svg>
