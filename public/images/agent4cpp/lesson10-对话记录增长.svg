<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#fafafa"/>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">对话记录是这么一圈圈长起来的</text>
  <text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#666">下面是 lab_agent.exe 真实跑出来的 7 条消息 —— 循环转了三圈，每圈加两条</text>

  <!-- 第0圈：开始 -->
  <text x="60" y="94" font-size="13.5" font-weight="bold" fill="#37474f">开始之前</text>
  <rect x="60" y="104" width="380" height="30" rx="5" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="72" y="124" font-size="11.5" font-family="Consolas, monospace" fill="#546e7a">[0] system | 你是工业软件助手…</text>
  <rect x="60" y="138" width="380" height="30" rx="5" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5"/>
  <text x="72" y="158" font-size="11.5" font-family="Consolas, monospace" fill="#0d47a1">[1] user | "图像有点暗"</text>

  <line x1="460" y1="136" x2="500" y2="136" stroke="#90a4ae" stroke-width="2" marker-end="url(#ar)"/>
  <text x="480" y="126" text-anchor="middle" font-size="11" fill="#78909c">第 1 圈</text>

  <!-- 第1圈结果 -->
  <rect x="504" y="104" width="400" height="30" rx="5" fill="#ffe0b2" stroke="#f9a825" stroke-width="1.5"/>
  <text x="516" y="124" font-size="11.5" font-family="Consolas, monospace" fill="#e65100">[2] assistant | 要调 get_camera_status</text>
  <rect x="504" y="138" width="400" height="48" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="516" y="156" font-size="11.5" font-family="Consolas, monospace" fill="#1b5e20">[3] tool | 相机状态已返回</text>
  <text x="516" y="174" font-size="11" font-family="Consolas, monospace" fill="#2e7d32">payload={brightness:0.5, target:1.0, 偏暗}</text>

  <!-- 第2圈 -->
  <text x="60" y="218" font-size="13.5" font-weight="bold" fill="#37474f">第 2 圈</text>
  <text x="60" y="238" font-size="11.5" fill="#78909c">把上面 4 条一起发过去，再问</text>
  <rect x="60" y="248" width="380" height="26" rx="5" fill="#eceff1" stroke="#b0bec5" stroke-width="1.2"/>
  <text x="72" y="266" font-size="11" fill="#90a4ae">[0][1][2][3] 全部重发…</text>

  <line x1="460" y1="261" x2="500" y2="261" stroke="#90a4ae" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="504" y="248" width="400" height="30" rx="5" fill="#ffe0b2" stroke="#f9a825" stroke-width="1.5"/>
  <text x="516" y="268" font-size="11.5" font-family="Consolas, monospace" fill="#e65100">[4] assistant | 要调 set_exposure {8000}</text>
  <rect x="504" y="282" width="400" height="48" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="516" y="300" font-size="11.5" font-family="Consolas, monospace" fill="#1b5e20">[5] tool | 曝光已更新</text>
  <text x="516" y="318" font-size="11" font-family="Consolas, monospace" fill="#2e7d32">payload={exposure_us:8000}</text>

  <!-- 第3圈 -->
  <text x="60" y="362" font-size="13.5" font-weight="bold" fill="#37474f">第 3 圈</text>
  <text x="60" y="382" font-size="11.5" fill="#78909c">把 6 条一起发过去，再问</text>
  <rect x="60" y="392" width="380" height="26" rx="5" fill="#eceff1" stroke="#b0bec5" stroke-width="1.2"/>
  <text x="72" y="410" font-size="11" fill="#90a4ae">[0]…[5] 全部重发…</text>

  <line x1="460" y1="405" x2="500" y2="405" stroke="#90a4ae" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="504" y="386" width="400" height="52" rx="5" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="516" y="406" font-size="11.5" font-family="Consolas, monospace" fill="#1b5e20">[6] assistant | "搞定，我把曝光从 5000</text>
  <text x="516" y="424" font-size="11.5" font-family="Consolas, monospace" fill="#1b5e20">调到了 8000"</text>
  <text x="516" y="438" font-size="11" font-weight="bold" fill="#2e7d32">没有 tool_call → 循环结束</text>

  <!-- 三个要点 -->
  <rect x="60" y="470" width="844" height="200" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="80" y="496" font-size="14.5" font-weight="bold" fill="#0d47a1">从这张图能看出三件事</text>

  <text x="80" y="526" font-size="13" font-weight="bold" fill="#1565c0">① 每圈都发【全部】记录，不是只发新的</text>
  <text x="100" y="546" font-size="12" fill="#1976d2">模型是无状态的，你不重发它就不知道之前聊过什么。代价是 token 消耗越来越大。</text>

  <text x="80" y="578" font-size="13" font-weight="bold" fill="#1565c0">② 工具结果也是一条消息，带 tool_call_id</text>
  <text x="100" y="598" font-size="12" fill="#1976d2">模型靠这个 id 知道"这条结果对应哪一次调用"。</text>

  <text x="80" y="630" font-size="13" font-weight="bold" fill="#1565c0">③ 停在哪一圈，看最后那条有没有 tool_call</text>
  <text x="100" y="650" font-size="12" fill="#1976d2">有 → 继续转；没有 → 它说完了。代码里没有一行判断"任务完成没有"。</text>
</svg>
