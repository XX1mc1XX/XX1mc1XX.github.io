<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#546e7a"/>
    </marker>
    <marker id="aG" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#388e3c"/>
    </marker>
    <marker id="aR" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="1000" height="760" fill="#fafafa"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">命中率是折扣，基座是税基</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#666">一步的等效成本 ≈ 新增 token + 基座 / 折扣率 —— 打折的比例，救不了乘积里的那个被乘数</text>

  <!-- 公式 -->
  <rect x="60" y="82" width="880" height="76" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="3"/>
  <text x="500" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#e65100" font-family="Consolas, monospace">一步等效成本 ≈ 新增 token + 基座 ÷ 折扣率</text>
  <text x="500" y="142" text-anchor="middle" font-size="12.5" fill="#8d6e63">折扣率由命中率决定 —— 但它只是一把乘在税基上的尺子</text>

  <!-- 两个数字对撞 -->
  <text x="60" y="198" font-size="14.5" font-weight="bold" fill="#37474f">两个必须一起读的数字</text>

  <rect x="60" y="214" width="420" height="150" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="80" y="242" font-size="13.5" font-weight="bold" fill="#1b5e20">R13 · 小基座</text>
  <text x="80" y="266" font-size="12" fill="#2e7d32">99.3% 命中</text>
  <text x="80" y="288" font-size="12" fill="#2e7d32">prompt 592,560</text>
  <rect x="80" y="300" width="380" height="48" rx="7" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
  <text x="270" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">当轮等效 ~5K</text>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#2e7d32">几乎等于免费</text>

  <rect x="520" y="214" width="420" height="150" rx="10" fill="#ffebee" stroke="#e53935" stroke-width="2.5"/>
  <text x="540" y="242" font-size="13.5" font-weight="bold" fill="#b71c1c">R15 · 大基座</text>
  <text x="540" y="266" font-size="12" fill="#c62828">96.4% 命中（只低 2.9 个百分点）</text>
  <text x="540" y="288" font-size="12" fill="#c62828">31 步 · 上下文 66K</text>
  <rect x="540" y="300" width="380" height="48" rx="7" fill="#ffcdd2" stroke="#e53935" stroke-width="2"/>
  <text x="730" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#b71c1c">当轮等效 ~118K</text>
  <text x="730" y="340" text-anchor="middle" font-size="11" fill="#c62828">贵了二十多倍</text>

  <!-- 乘数效应 -->
  <text x="60" y="400" font-size="14.5" font-weight="bold" fill="#37474f">基座为什么是乘数：一轮的总输入 ≈ 步数 × 基座</text>

  <rect x="60" y="416" width="430" height="96" rx="9" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="78" y="440" font-size="12" fill="#b71c1c">基座 770K × 17 步</text>
  <text x="78" y="466" font-size="13" font-family="Consolas, monospace" font-weight="bold" fill="#b71c1c">= 13,090,000 ≈ 1316 万 token</text>
  <text x="78" y="492" font-size="11.5" fill="#c62828">每一步都在为重读一份更厚的档案付费</text>

  <rect x="510" y="416" width="430" height="96" rx="9" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="528" y="440" font-size="12" fill="#1b5e20">基座 50K × 同样的 17 步</text>
  <text x="528" y="466" font-size="13" font-family="Consolas, monospace" font-weight="bold" fill="#1b5e20">= 850,000 ≈ 92 万 token</text>
  <text x="528" y="492" font-size="11.5" fill="#2e7d32">同样的活、同样的步数，输入差 14 倍</text>

  <!-- 折扣光谱 -->
  <text x="60" y="546" font-size="14.5" font-weight="bold" fill="#37474f">把折扣当自变量：同一套架构，从 0.95× 到 1.58×</text>

  <rect x="60" y="560" width="880" height="170" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>

  <rect x="78" y="576" width="252" height="68" rx="7" fill="#ffffff" stroke="#e53935" stroke-width="2.2"/>
  <text x="92" y="598" font-size="12" font-weight="bold" fill="#b71c1c">1/40（Claude Fable / Mythos）</text>
  <text x="92" y="618" font-size="12" font-weight="bold" fill="#b71c1c">含整理开销 0.95×</text>
  <text x="92" y="636" font-size="11" fill="#c62828">略亏 5% —— 整理成了净支出</text>

  <rect x="342" y="576" width="252" height="68" rx="7" fill="#ffffff" stroke="#f9a825" stroke-width="1.8"/>
  <text x="356" y="598" font-size="12" font-weight="bold" fill="#e65100">1/30（DeepSeek 空闲）</text>
  <text x="356" y="618" font-size="12" font-weight="bold" fill="#e65100">含整理开销 1.00×</text>
  <text x="356" y="636" font-size="11" fill="#8d6e63">盈亏平衡点 ≈ 1/25 附近</text>

  <rect x="606" y="576" width="316" height="68" rx="7" fill="#ffffff" stroke="#388e3c" stroke-width="2.2"/>
  <text x="620" y="598" font-size="12" font-weight="bold" fill="#1b5e20">1/10（OpenAI / Claude / Gemini）</text>
  <text x="620" y="618" font-size="12" font-weight="bold" fill="#1b5e20">含整理开销 1.30×（等效 1.56×）</text>
  <text x="620" y="636" font-size="11" fill="#2e7d32">行业主流，恰好落在净收益一侧</text>

  <rect x="78" y="656" width="844" height="58" rx="7" fill="#fffde7" stroke="#f9a825" stroke-width="1.8"/>
  <text x="94" y="678" font-size="12" fill="#8d6e63">光谱两端差 8 倍。折得越深，服务商替你承担的「重新发一遍」越多，而你为降低基座花的整理调用越不划算。</text>
  <text x="94" y="700" font-size="12" font-weight="bold" fill="#e65100">折扣深度不是我们的参数，是服务商的参数 —— 所以「打平/领先」的结论必须标注算的是哪一档。</text>
</svg>
